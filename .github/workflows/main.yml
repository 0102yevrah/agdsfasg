name: Build BLE Mode Switcher FAP

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out firmware and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build FAP
        run: ./fbt fap_ble_mode_switcher

      - name: Upload FAP artifact
        uses: actions/upload-artifact@v5
        with:
          name: ble-mode-switcher-f7
          path: build/**/.extapps/ble_mode_switcher.fap
